<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>manifesto-map</title>
<!-- Önizleme: Webflow sitesinin Space Mono fontu varsayıldı -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---- ÖNİZLEME KABUĞU: Webflow'a gitmez ---- */

.lab-nav { font: 12px/1.4 "Space Mono", monospace; padding: 10px 16px; border-bottom: 1px dashed #999; opacity: .7; }
.lab-nav a { color: inherit; }
.lab-nav span { opacity: .6; }
* { box-sizing: border-box; }
body { margin: 0; font-family: "Space Mono", monospace; }

body { background: #ffffff; color: #0a0a0a; }
.lab-kutu { max-width: 1100px; margin: 48px auto; padding: 0 16px; }

</style>
</head>
<body>
<nav class="lab-nav"><a href="index.html">← lab</a> · manifesto-map · <span>beyaz zemin, #uqa-map kutusu taklit · harita: dunya.svg</span></nav>
<main class="lab-kutu">
  <div id="uqa-map"></div>
</main>
<div class="w-embed">
<!-- EMBED BAŞLA -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  const box = document.getElementById('uqa-map');
  if (!box) return;

  // World map image: upload dunya.svg to Webflow Assets and paste its link here
  const MAP_URL = 'dunya.svg';

  const THEME = { label: '#333333', accent: '#e03a2f', tipBg: '#ffffff', tipText: '#0a0a0a', tipMuted: '#888888' };

  // Line types: the buttons in the bottom right corner switch them on and off
  const TYPES = {
    red:   { color: '#e03a2f', label: 'Meslek örgütleri' },
    blue:  { color: '#2f6fd6', label: 'Uluslararası ağ' },
    green: { color: '#2e9b5a', label: 'Üniversite atölyeleri' }
  };

  // Places. The first one is the centre; every event elsewhere gets an arc from it.
  // lat / lon come from Google Maps (right click on the spot). side: 'r' / 'l' puts the name on the right / left.
  const places = {
    ankara:    { city: 'Ankara', lat: 39.93, lon: 32.86, side: 'r' },
    istanbul:  { city: 'İstanbul', lat: 41.01, lon: 28.98, side: 'l' },
    gebze:     { city: 'Gebze', lat: 40.80, lon: 29.43, side: 'r' },
    eskisehir: { city: 'Eskişehir', lat: 39.78, lon: 30.52 },
    izmir:     { city: 'İzmir', lat: 38.42, lon: 27.14 },
    venedik:   { city: 'Venedik', lat: 45.44, lon: 12.33 },
    atina:     { city: 'Atina', lat: 37.98, lon: 23.73 }
  };
  // The map also opens far enough to show these points (Britain)
  const SHOW_ALSO = [[58.6, -3], [50, -5.7]];

  // Events. To add one: copy a line and change it.
  const events = [
    { at: 'ankara', name: 'ODTÜ, Bilkent, Gazi, TED, Atılım, Başkent, TOBB ETÜ, Unite, Kennedy 41, Mimarlar Derneği 1927 ve diğerleri', date: '2024–2026' },
    { at: 'istanbul', type: 'red', name: 'Herkes İçin Mimarlık - Yaz Okulu', date: '05.08.2025' },
    { at: 'istanbul', type: 'green', name: 'Mimarlıkta Rahatsız Edici Sorular: Yeditepe', date: '20–24.10.2025' },
    { at: 'istanbul', type: 'red', name: 'Mimarlık ve Eğitim Kurultayı - XIII (MSGSÜ)', date: '14–15.11.2025' },
    { at: 'istanbul', type: 'green', name: 'Situated Architectural Pedagogies of Co-making (İTÜ)', date: '19–20.09.2026' },
    { at: 'gebze', type: 'green', name: 'PUPA: Mimarlıkta Rahatsız Edici Sorular (GTÜ)', date: '12.09.2025' },
    { at: 'eskisehir', type: 'green', name: 'Atölye - Kabuk Fanzin (ESOGÜ)', date: '13.04.2026' },
    { at: 'izmir', type: 'green', name: 'Open forum, DEU Architecture Faculty', date: '2025' },
    { at: 'venedik', type: 'blue', name: 'Venedik Bienali - Mimarlık İşçileri Kolektifleri Buluşması', date: '08.07.2025' },
    { at: 'atina', type: 'blue', name: 'AKEA Çalışan Mimarların Uluslararası Buluşması', date: '08.02.2026' }
  ];

  // Same projection as the map image (Miller, 10 units per degree). Change one, change both.
  const miller = lat => 1.25 * Math.log(Math.tan(Math.PI / 4 + 0.4 * lat * Math.PI / 180));
  const xy = (lat, lon) => [(lon + 180) * 10, (miller(84) - miller(lat)) * 1800 / Math.PI];
  const ids = Object.keys(places), hub = places[ids[0]];
  ids.forEach(id => {
    const p = places[id];
    [p.x, p.y] = xy(p.lat, p.lon);
    p.events = events.filter(e => e.at === id);
    p.types = [...new Set(p.events.map(e => e.type).filter(Boolean))];
  });
  const extra = SHOW_ALSO.map(([la, lo]) => { const [x, y] = xy(la, lo); return { x, y }; });

  const NS = 'http://www.w3.org/2000/svg', RATIO = 900 / 413, MIN_W = 130, MAX_W = 3600;
  const svg = document.createElementNS(NS, 'svg');
  svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab';
  // The map is read into the page so its borders stay thin at every zoom; if that fails it is shown as an image
  const map = document.createElementNS(NS, 'g');
  map.style.pointerEvents = 'none';
  fetch(MAP_URL).then(r => r.ok ? r.text() : Promise.reject()).then(t => map.innerHTML = t.replace(/<\/?svg[^>]*>/g, '')).catch(() => {
    map.innerHTML = `<image href="${MAP_URL}" width="3600" height="1775"/>`;
  });
  const layer = document.createElementNS(NS, 'g');
  svg.append(map, layer);

  let base, cur;
  const off = new Set();

  // Frame: fits everything, and keeps the centre away from the edges
  const fit = () => {
    const pts = [...Object.values(places), ...extra].map(p => [p.x, p.y]), pad = 25;
    let x0 = Math.min(...pts.map(p => p[0])) - pad, x1 = Math.max(...pts.map(p => p[0])) + pad;
    let y0 = Math.min(...pts.map(p => p[1])) - pad, y1 = Math.max(...pts.map(p => p[1])) + pad;
    x1 = Math.max(x1, hub.x + (hub.x - x0) * 0.45); x0 = Math.min(x0, hub.x - (x1 - hub.x) * 0.45);
    y1 = Math.max(y1, hub.y + (hub.y - y0) * 0.45); y0 = Math.min(y0, hub.y - (y1 - hub.y) * 0.45);
    const w = Math.max(x1 - x0, (y1 - y0) * RATIO, 220);
    return [(x0 + x1 - w) / 2, (y0 + y1 - w / RATIO) / 2, w];
  };

  // Arc that bows away from the straight line; a second arc to the same place bows a little more
  const arc = (a, b, n) => {
    const dx = b[0] - a[0], dy = b[1] - a[1], k = (0.22 + n * 0.18) * (dx < 0 ? 1 : -1);
    return `M${a[0]} ${a[1]}Q${(a[0] + b[0]) / 2 - dy * k} ${(a[1] + b[1]) / 2 + dx * k} ${b[0]} ${b[1]}`;
  };

  // Draws lines and pins for the current frame; s keeps them the same size at every zoom
  const draw = () => {
    const [vx, vy, w] = cur, s = w / 900;
    svg.setAttribute('viewBox', `${vx} ${vy} ${w} ${w / RATIO}`);
    box.style.touchAction = w < base[2] * 0.99 ? 'none' : 'pan-y';
    let out = '';
    ids.slice(1).forEach(id => places[id].types.forEach((t, n) =>
      out += `<path class="uqa-line${off.has(t) ? ' uqa-off' : ''}" d="${arc([hub.x, hub.y], [places[id].x, places[id].y], n)}" fill="none" stroke="${TYPES[t].color}" stroke-width="${1.2 * s}" stroke-dasharray="${4 * s},${6 * s}"/>`));
    ids.forEach((id, i) => {
      const p = places[id], { x, y } = p, side = { r: 1, l: -1 }[p.side] || 0;
      const [r1, r2, r3, ty] = (i === 0 ? [14, 8, 4.5, 21] : p.events.length > 1 ? [11, 5.5, 3, 17] : [10, 5, 2.5, 16]).map(v => v * s);
      const c = i === 0 || !p.types.length ? THEME.accent : TYPES[p.types[0]].color;
      const dim = p.types.length && p.types.every(t => off.has(t)) ? ' uqa-dim' : '';
      out += `<g class="uqa-pin${dim}" data-id="${id}">
        <circle cx="${x}" cy="${y}" r="${r1}" fill="${c}" opacity="0.15"/>
        <circle cx="${x}" cy="${y}" r="${r2}" fill="${c}" opacity="0.4"/>
        <circle cx="${x}" cy="${y}" r="${r3}" fill="${c}"/>
        <text x="${x + side * (r1 + 2 * s)}" y="${side ? y + 3 * s : y + ty}" text-anchor="${['end', 'middle', 'start'][side + 1]}" font-family="Space Mono, monospace" font-size="${(i === 0 ? 10 : 8) * s}" font-weight="700" fill="${i === 0 ? THEME.accent : THEME.label}" letter-spacing="0.05em">${p.city.toLocaleUpperCase('tr')}</text>
      </g>`;
    });
    layer.innerHTML = out;
  };

  const reset = () => { cur = base.slice(); draw(); };

  // Zoom around a point given in pixels inside the box (the centre if none)
  const zoom = (f, px, py) => {
    const r = box.getBoundingClientRect(), [vx, vy, w] = cur;
    const nw = Math.min(MAX_W, Math.max(MIN_W, w * f));
    px = px ?? r.width / 2; py = py ?? r.height / 2;
    cur = [vx + px / r.width * (w - nw), vy + py / r.height * (w - nw) / RATIO, nw];
    draw();
  };

  Object.assign(box.style, { position: 'relative', overflow: 'hidden', background: 'transparent', width: '100%', aspectRatio: '900 / 413' });
  box.innerHTML = '';
  box.appendChild(svg);

  const style = document.createElement('style');
  style.textContent = `
    .uqa-pin { cursor: pointer; transition: opacity 0.3s; }
    .uqa-line { opacity: 0.6; transition: opacity 0.3s; }
    .uqa-off { opacity: 0 !important; }
    .uqa-pin.uqa-dim { opacity: 0.25; }
    .uqa-ui { position: absolute; display: flex; gap: 0.3rem; z-index: 5; }
    .uqa-ui button { display: flex; align-items: center; gap: 0.5rem; background: ${THEME.tipBg}; border: 1px solid #ddd; padding: 0.25rem 0.6rem; font: 0.6rem 'Space Mono', monospace; color: ${THEME.tipText}; cursor: pointer; }
    .uqa-ui button i { width: 1.4rem; height: 4px; }
    .uqa-ui button[aria-pressed="false"] { opacity: 0.4; }
    .uqa-tip { position: absolute; background: ${THEME.tipBg}; border: 1px solid ${THEME.accent}; padding: 0.7rem 0.9rem; font-family: 'Space Mono', monospace;
      font-size: 0.65rem; color: ${THEME.tipText}; pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 10; max-width: 260px; line-height: 1.6; }
    .uqa-tip.visible { opacity: 1; }
    .uqa-tip strong { color: ${THEME.accent}; display: block; margin-bottom: 0.25rem; }
    .uqa-tip .uqa-tip-date { color: ${THEME.tipMuted}; font-size: 0.6rem; display: block; margin-bottom: 0.3rem; }`;
  document.head.appendChild(style);

  const panel = (css, items) => {
    const d = document.createElement('div');
    d.className = 'uqa-ui';
    d.style.cssText = css;
    items.forEach(([html, onClick]) => {
      const b = document.createElement('button');
      b.innerHTML = html;
      b.addEventListener('click', () => onClick(b));
      d.appendChild(b);
    });
    box.appendChild(d);
    return [...d.children];
  };

  panel('right:0.75rem;top:0.75rem;flex-direction:column', [['+', () => zoom(1 / 1.5)], ['−', () => zoom(1.5)], ['⟲', reset]]);
  panel('right:0.75rem;bottom:0.75rem;flex-direction:column', Object.entries(TYPES).map(([t, { color, label }]) => [`<i style="background:${color}"></i>${label}`, b => {
    off.has(t) ? off.delete(t) : off.add(t);
    b.setAttribute('aria-pressed', !off.has(t));
    draw();
  }])).forEach(b => b.setAttribute('aria-pressed', 'true'));

  const tip = document.createElement('div');
  tip.className = 'uqa-tip';
  box.appendChild(tip);

  const show = (pin) => {
    const p = places[pin.dataset.id];
    tip.innerHTML = '';
    const name = document.createElement('strong'); name.textContent = p.city;
    tip.append(name);
    p.events.forEach(e => {
      const ev = document.createElement('span'); ev.textContent = e.name; ev.style.display = 'block';
      const dt = document.createElement('span'); dt.className = 'uqa-tip-date'; dt.textContent = e.date;
      tip.append(ev, dt);
    });
    const b = box.getBoundingClientRect(), r = pin.getBoundingClientRect();
    let left = r.right - b.left + 8, top = r.top - b.top - 10;
    if (left + 270 > b.width) left = r.left - b.left - 270;
    tip.style.left = Math.max(10, left) + 'px';
    tip.style.top = Math.max(10, Math.min(top, b.height - tip.offsetHeight - 10)) + 'px';
    tip.classList.add('visible');
  };
  const pinOf = e => e.target.closest && e.target.closest('.uqa-pin');
  svg.addEventListener('mouseover', e => pinOf(e) && show(pinOf(e)));
  svg.addEventListener('mouseout', e => pinOf(e) && tip.classList.remove('visible'));
  svg.addEventListener('click', e => pinOf(e) && show(pinOf(e))); // tap support on phones

  // Move the map by a number of pixels
  const pan = (dx, dy) => {
    const k = cur[2] / box.getBoundingClientRect().width;
    cur = [cur[0] - dx * k, cur[1] - dy * k, cur[2]];
    tip.classList.remove('visible');
    draw();
  };

  // Drag to move (on phones only once zoomed in, so one finger still scrolls the page)
  let drag = null;
  svg.addEventListener('pointerdown', e => {
    if (pinOf(e) || box.style.touchAction !== 'none' && e.pointerType === 'touch') return;
    drag = [e.clientX, e.clientY];
    svg.setPointerCapture(e.pointerId);
    svg.style.cursor = 'grabbing';
  });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    pan(e.clientX - drag[0], e.clientY - drag[1]);
    drag = [e.clientX, e.clientY];
  });
  svg.addEventListener('pointerup', () => { drag = null; svg.style.cursor = 'grab'; });

  // Mouse wheel and trackpad zoom while the pointer is over the map
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = box.getBoundingClientRect();
    zoom(Math.exp(e.deltaY * (e.ctrlKey ? 0.01 : 0.002)), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  // Two fingers on a phone: pinch to zoom, move to pan
  let pinch = null;
  const two = e => {
    const [a, b] = e.touches, r = box.getBoundingClientRect();
    return [Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), (a.clientX + b.clientX) / 2 - r.left, (a.clientY + b.clientY) / 2 - r.top];
  };
  svg.addEventListener('touchstart', e => { if (e.touches.length === 2) { pinch = two(e); drag = null; } }, { passive: true });
  svg.addEventListener('touchmove', e => {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    const [d, x, y] = two(e);
    pan(x - pinch[1], y - pinch[2]);
    zoom(pinch[0] / d, x, y);
    pinch = [d, x, y];
  }, { passive: false });
  svg.addEventListener('touchend', () => { pinch = null; });

  base = fit();
  reset();
});
</script>
<!-- EMBED BİTİR -->
</div>
<script src="kritik.js" data-sayfa="manifesto-map"></script>
</body>
</html>
