<!-- UQA Network Visualization — Webflow embed    -->

<style>

  .uqa-network-svg {
    width: 100%;
    height: 100%;
    display: block;
    background-color: var(--brand--background);
  }
  .uqa-network-svg circle.uqa-node-dot { cursor: pointer; }
</style>

<section class="uqa-network-section">
  <svg class="uqa-network-svg" xmlns="http://www.w3.org/2000/svg"></svg>
</section>

<script>
(function() {
  const svg = document.currentScript.parentElement.querySelector('.uqa-network-svg');
  const VIEWBOX_W = 1400;
  const VIEWBOX_H = 900;
  svg.setAttribute('viewBox', `0 0 ${VIEWBOX_W} ${VIEWBOX_H}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  // Seeded random: the same mix on every load. Change SEED to reshuffle.
  const SEED = 728;
  const rand = (() => {
    let a = SEED;
    return () => {
      a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  })();
  const pick = list => list[Math.floor(rand() * list.length)];
  const shuffle = list => {
    const a = [...list];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };

  // Universities, same list as manifesto-network. hacked: we held an event there.
  // METU in the middle, Ankara on an inner ring, the rest on an outer ring.
  // Not visited yet (hacked: false): no fill, and no ties to the other universities.
  const UNIVERSITIES = [
    { id: 'metu',     name: 'ODTÜ',                     hacked: true,  x: 700,  y: 450 },
    { id: 'cankaya',  name: 'Çankaya Üniversitesi',     hacked: false, x: 816,  y: 215 },
    { id: 'bilkent',  name: 'Bilkent Üniversitesi',     hacked: true,  x: 994,  y: 325 },
    { id: 'medipol',  name: 'Medipol Üniversitesi',     hacked: false, x: 1035, y: 493 },
    { id: 'gazi',     name: 'Gazi Üniversitesi',        hacked: true,  x: 919,  y: 642 },
    { id: 'atilim',   name: 'Atılım Üniversitesi',      hacked: true,  x: 700,  y: 700 },
    { id: 'ted',      name: 'TED Üniversitesi',         hacked: true,  x: 481,  y: 642 },
    { id: 'tobb',     name: 'TOBB ETÜ',                 hacked: true,  x: 365,  y: 493 },
    { id: 'baskent',  name: 'Başkent Üniversitesi',     hacked: true,  x: 406,  y: 325 },
    { id: 'ybu',      name: 'Yıldırım Beyazıt Üniversitesi', hacked: false, x: 584, y: 215 },
    // Outside Ankara
    { id: 'itu',      name: 'İstanbul Teknik Üniversitesi',  hacked: true, x: 700,  y: 95 },
    { id: 'yeditepe', name: 'Yeditepe Üniversitesi',         hacked: true, x: 1271, y: 336 },
    { id: 'gtu',      name: 'Gebze Teknik Üniversitesi',     hacked: true, x: 1053, y: 749 },
    { id: 'msgsu',    name: 'Mimar Sinan Güzel Sanatlar Üniversitesi', hacked: true, x: 347, y: 749 },
    { id: 'esogu',    name: 'Eskişehir Osmangazi Üniversitesi', hacked: true, x: 129, y: 336 },
  ];

  // Each person gets a role; the role is the hover label and decides the dot style
  const ACADEMIC = 'Akademisyen';
  const ASSISTANT = ['Araştırma Görevlisi', 'Doktora Öğrencisi'];
  const lookOf = role => role === ACADEMIC ? 'academic' : ASSISTANT.includes(role) ? 'assistant' : 'student';
  // Around a university: mostly students, a few assistants, the odd academic
  const UNI_POOL = [
    'Öğrenci', 'Öğrenci', 'Öğrenci', 'Öğrenci',
    'Yüksek Lisans Öğrencisi', 'Yüksek Lisans Öğrencisi', 'Mezun',
    'Araştırma Görevlisi', 'Araştırma Görevlisi', 'Doktora Öğrencisi',
    ACADEMIC, ACADEMIC,
  ];

  const NODES = [];

  UNIVERSITIES.forEach(u => {
    NODES.push({
      id: u.id, name: u.name, type: 'university', hacked: u.hacked,
      x: u.x, y: u.y, originX: u.x, originY: u.y,
      driftRadius: 12,
    });
  });

  // Organizing team around METU: 5 academics, 3 research assistants, 2 students
  const ORG_TITLES = shuffle([
    ACADEMIC, ACADEMIC, ACADEMIC, ACADEMIC, ACADEMIC,
    'Araştırma Görevlisi', 'Araştırma Görevlisi', 'Araştırma Görevlisi',
    pick(['Yüksek Lisans Öğrencisi', 'Doktora Öğrencisi']), 'Öğrenci',
  ]);
  const ORG_OFFSETS = [
    [-80, -50], [40, -90], [100, -30], [110, 50], [40, 100],
    [-50, 110], [-110, 50], [-100, -30], [30, -40], [0, 60],
  ];
  ORG_OFFSETS.forEach((offset, i) => {
    NODES.push({
      id: `org${i+1}`, name: ORG_TITLES[i], type: 'org-team', look: lookOf(ORG_TITLES[i]),
      x: 700 + offset[0], y: 450 + offset[1],
      originX: 700 + offset[0], originY: 450 + offset[1],
      driftRadius: 14 + rand() * 8,
    });
  });

  // 6 ARCH571 students
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2 + 0.3;
    const r = 150;
    const x = 700 + Math.cos(angle) * r;
    const y = 450 + Math.sin(angle) * r;
    NODES.push({
      id: `a571_${i+1}`, name: 'ARCH 571 Öğrencisi', type: 'arch571',
      x, y, originX: x, originY: y, driftRadius: 15,
    });
  }

  // People around each university. Visited: 3–6 from the pool.
  // Not visited: 1–2, the first one an academic we are in touch with.
  const SAT_COUNT = {};
  UNIVERSITIES.forEach(uni => {
    const titles = uni.hacked
      ? Array.from({ length: 3 + Math.floor(rand() * 4) }, () => pick(UNI_POOL))
      : [ACADEMIC, ...Array.from({ length: Math.floor(rand() * 2) }, () => pick(UNI_POOL))];
    SAT_COUNT[uni.id] = titles.length;
    titles.forEach((title, i) => {
      const angle = (i / titles.length) * Math.PI * 2 + rand() * 0.6;
      const r = 24 + rand() * 20;
      const x = uni.x + Math.cos(angle) * r;
      const y = uni.y + Math.sin(angle) * r;
      NODES.push({
        id: `sat_${uni.id}_${i+1}`, name: title,
        type: 'member', look: lookOf(title), homeUni: uni.id,
        x, y, originX: x, originY: y, driftRadius: 6,
      });
    });
  });

  // 8 architecture workers, in the gaps of the outer ring on both sides
  const WORKER_TITLES = ['Ücretli Çalışan Mimar', 'İşsiz Mimar', 'Serbest Çalışan Mimar', 'Şantiye Mimarı', 'Stajyer Mimar'];
  const WORKER_POSITIONS = [
    [1230, 560], [1300, 600], [1250, 650], [1320, 520],
    [170, 560], [100, 600], [150, 650], [80, 520],
  ];
  WORKER_POSITIONS.forEach((pos, i) => {
    NODES.push({
      id: `w${i+1}`, name: pick(WORKER_TITLES), type: 'worker',
      x: pos[0], y: pos[1], originX: pos[0], originY: pos[1],
      driftRadius: 20,
    });
  });

  // ─────────────────────────────────────────────
  // CONNECTIONS
  // ─────────────────────────────────────────────

  const CONNECTIONS = [];
  const addConn = (from, to, kind) => CONNECTIONS.push({ from, to, kind });
  const HACKED_UNIS = UNIVERSITIES.filter(u => u.hacked);
  const UNHACKED_UNIS = UNIVERSITIES.filter(u => !u.hacked);
  const sats = id => Array.from({ length: SAT_COUNT[id] }, (_, i) => `sat_${id}_${i+1}`);

  // Primary: the organizing team ties METU to the universities we went to
  const IN_BETWEEN = [
    ['org1', 'bilkent'], ['org2', 'gazi'], ['org3', 'ted'], ['org4', 'baskent'],
    ['org5', 'atilim'], ['org6', 'tobb'], ['org7', 'itu'], ['org7', 'gtu'],
    ['org8', 'msgsu'], ['org9', 'yeditepe'], ['org10', 'esogu'],
  ];
  ORG_OFFSETS.forEach((_, i) => addConn(`org${i+1}`, 'metu', 'primary'));
  IN_BETWEEN.forEach(([org, uni]) => addConn(org, uni, 'primary'));

  // Secondary: ARCH571 to METU + supervisor
  const ARCH_SUPERVISORS = ['org1', 'org2', 'org3', 'org4', 'org5', 'org6'];
  for (let i = 0; i < 6; i++) {
    addConn(`a571_${i+1}`, 'metu', 'secondary');
    addConn(`a571_${i+1}`, ARCH_SUPERVISORS[i], 'secondary');
  }

  // Secondary: people to their university
  UNIVERSITIES.forEach(uni => sats(uni.id).forEach(s => addConn(s, uni.id, 'secondary')));

  // Secondary: our contact at a university we have not visited yet, back to METU
  UNHACKED_UNIS.forEach(uni => addConn(`sat_${uni.id}_1`, 'metu', 'secondary'));

  // Secondary: academic-to-academic infrastructure
  const ACAD_TO_ACAD = [
    ['org1', 'org2'], ['org1', 'org5'], ['org2', 'org3'],
    ['org3', 'org6'], ['org4', 'org7'], ['org5', 'org8'],
    ['org6', 'org9'], ['org7', 'org10'], ['org4', 'org8'],
  ];
  ACAD_TO_ACAD.forEach(([a, b]) => addConn(a, b, 'secondary'));

  // Peripheral: each visited university to its visited neighbours on the same ring
  const RINGS = [
    ['bilkent', 'gazi', 'atilim', 'ted', 'tobb', 'baskent'],
    ['itu', 'yeditepe', 'gtu', 'msgsu', 'esogu'],
  ];
  RINGS.forEach(ring => ring.forEach((id, i) => addConn(id, ring[(i + 1) % ring.length], 'peripheral')));
  // ...and each university outside Ankara to the two nearest Ankara ones
  const UNI = Object.fromEntries(UNIVERSITIES.map(u => [u.id, u]));
  RINGS[1].forEach(id => {
    const d = k => Math.hypot(UNI[k].x - UNI[id].x, UNI[k].y - UNI[id].y);
    [...RINGS[0]].sort((a, b) => d(a) - d(b)).slice(0, 2).forEach(k => addConn(id, k, 'peripheral'));
  });

  // Peripheral: people who know each other across visited universities, and ARCH571 bridges
  const VISITED_SATS = HACKED_UNIS.flatMap(u => sats(u.id));
  for (let n = 0; n < 10; n++) {
    const a = pick(VISITED_SATS), b = pick(VISITED_SATS);
    if (a.split('_')[1] !== b.split('_')[1]) addConn(a, b, 'peripheral');
  }
  for (let i = 0; i < 3; i++) addConn(pick(VISITED_SATS), `a571_${i+1}`, 'peripheral');

  // Peripheral: workers form two small groups, each worker tied to one team member
  [['w1', 'w2'], ['w2', 'w3'], ['w3', 'w4'], ['w4', 'w1'],
   ['w5', 'w6'], ['w6', 'w7'], ['w7', 'w8'], ['w8', 'w5'],
   ['w1', 'org4'], ['w2', 'org3'], ['w3', 'org4'], ['w4', 'org2'],
   ['w5', 'org7'], ['w6', 'org8'], ['w7', 'org7'], ['w8', 'org6']].forEach(([a, b]) => addConn(a, b, 'peripheral'));

  // ─────────────────────────────────────────────
  // STYLES
  // ─────────────────────────────────────────────

  const STYLE = {
    university: { radius: 14, fill: '#000000' },
    academic:   { radius: 9,  fill: '#555555' },
    assistant:  { radius: 7.5, fill: '#888888' },
    arch571:    { radius: 7,  fill: '#999999' },
    student:    { radius: 6,  fill: '#b0b0b0' },
    worker:     { radius: 7,  fill: '#c0c0c0' },
  };

  const UNI_RING = {
    outerRadius: 55,
    innerRadius: 40,
    outerStroke: '#cccccc',
    outerStrokeWidth: 1,
    outerDash: '5,4',
    hackedFill: '#f2f2f2',
    unhackedFill: 'none',
  };

  const LINE_STYLES = {
    primary:    { color: '#333333', width: 1.1, opacity: 0.65, dash: '6,4' },
    secondary:  { color: '#777777', width: 0.8, opacity: 0.45, dash: '4,4' },
    peripheral: { color: '#b0b0b0', width: 0.6, opacity: 0.35, dash: '2,4' },
  };

  // Motion
  const DRIFT_SPEED_MIN = 0.08;
  const DRIFT_SPEED_MAX = 0.24;
  const PADDING = 60;

  NODES.forEach(node => {
    const angle = rand() * Math.PI * 2;
    const speed = DRIFT_SPEED_MIN + rand() * (DRIFT_SPEED_MAX - DRIFT_SPEED_MIN);
    node.vx = Math.cos(angle) * speed;
    node.vy = Math.sin(angle) * speed;
  });

  const NODE_MAP = {};
  NODES.forEach(n => NODE_MAP[n.id] = n);

  const NS = 'http://www.w3.org/2000/svg';

  // Render
  const ringGroup = document.createElementNS(NS, 'g');
  svg.appendChild(ringGroup);

  NODES.filter(n => n.type === 'university').forEach(node => {
    if (node.hacked) {
      const innerFill = document.createElementNS(NS, 'circle');
      innerFill.setAttribute('r', UNI_RING.innerRadius);
      innerFill.setAttribute('fill', UNI_RING.hackedFill);
      innerFill.setAttribute('stroke', 'none');
      ringGroup.appendChild(innerFill);
      node.innerFillEl = innerFill;
    }
    const outerRing = document.createElementNS(NS, 'circle');
    outerRing.setAttribute('r', UNI_RING.outerRadius);
    outerRing.setAttribute('fill', 'none');
    outerRing.setAttribute('stroke', UNI_RING.outerStroke);
    outerRing.setAttribute('stroke-width', UNI_RING.outerStrokeWidth);
    outerRing.setAttribute('stroke-dasharray', UNI_RING.outerDash);
    ringGroup.appendChild(outerRing);
    node.outerRingEl = outerRing;
  });

  const lineGroup = document.createElementNS(NS, 'g');
  svg.appendChild(lineGroup);

  const lineEls = CONNECTIONS.map(conn => {
    const style = LINE_STYLES[conn.kind];
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('stroke', style.color);
    line.setAttribute('stroke-width', style.width);
    line.setAttribute('opacity', style.opacity);
    line.setAttribute('stroke-dasharray', style.dash);
    lineGroup.appendChild(line);
    return { el: line, base: style.opacity, from: NODE_MAP[conn.from], to: NODE_MAP[conn.to] };
  }).filter(x => x.from && x.to);

  const nodeGroup = document.createElementNS(NS, 'g');
  svg.appendChild(nodeGroup);

  NODES.forEach(node => {
    const style = STYLE[node.look || node.type];
    const circle = document.createElementNS(NS, 'circle');
    circle.setAttribute('r', style.radius);
    circle.setAttribute('fill', style.fill);
    circle.setAttribute('class', 'uqa-node-dot');
    circle.dataset.nodeId = node.id;
    nodeGroup.appendChild(circle);
    node.el = circle;
    node.r0 = style.radius;
    node.glow = 0;
  });

  // Hover label
  const labelGroup = document.createElementNS(NS, 'g');
  labelGroup.style.opacity = '0';
  labelGroup.style.pointerEvents = 'none';
  svg.appendChild(labelGroup);

  const labelText = document.createElementNS(NS, 'text');
  labelText.setAttribute('fill', '#111111');
  labelText.setAttribute('font-size', '16');
  // A thin outline in the page colour keeps the text readable over lines and dots
  labelText.setAttribute('stroke', 'var(--brand--background, #ffffff)');
  labelText.setAttribute('stroke-width', 4);
  labelText.setAttribute('paint-order', 'stroke');
  labelText.setAttribute('text-anchor', 'middle');
  labelText.setAttribute('dominant-baseline', 'middle');
  labelGroup.appendChild(labelText);

  let hoveredNode = null;

  // Rhythm: universities light up one by one, in the order we first went there,
  // as if hovered. A real hover takes over and the rhythm picks up again after it.
  const RHYTHM = ['metu', 'bilkent', 'gazi', 'ted', 'atilim', 'baskent', 'tobb', 'gtu', 'itu', 'yeditepe', 'msgsu', 'esogu'];
  const RHYTHM_MS = 2200;   // time each university stays lit
  const RESUME_MS = 800;    // pause after a hover before the rhythm continues
  let beat = -1, autoNode = null, nextBeat = 0;

  NODES.forEach(node => {
    node.el.addEventListener('mouseenter', () => { hoveredNode = node; });
    node.el.addEventListener('mouseleave', () => {
      hoveredNode = null;
      nextBeat = performance.now() + RESUME_MS;
    });
  });

  // How lit a node is: a university by itself, a person through their university
  const glowOf = n => n.type === 'university' ? n.glow : n.homeUni ? NODE_MAP[n.homeUni].glow : 0;

  // Animation
  function tick(now = 0) {
    if (!hoveredNode && now >= nextBeat) {
      beat = (beat + 1) % RHYTHM.length;
      autoNode = NODE_MAP[RHYTHM[beat]];
      nextBeat = now + RHYTHM_MS;
    }
    const focus = hoveredNode || autoNode;
    if (labelText.textContent !== focus.name) labelText.textContent = focus.name;
    labelGroup.style.opacity = '1';

    NODES.forEach(node => {
      if (node.type === 'university') node.glow += ((node === focus ? 1 : 0) - node.glow) * 0.08;
    });

    NODES.forEach(node => {
      node.x += node.vx;
      node.y += node.vy;

      const dx = node.x - node.originX;
      const dy = node.y - node.originY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > node.driftRadius) {
        const pullStrength = 0.02;
        node.vx -= (dx / dist) * pullStrength;
        node.vy -= (dy / dist) * pullStrength;
      }

      if (node.x < PADDING) { node.vx = Math.abs(node.vx); }
      if (node.x > VIEWBOX_W - PADDING) { node.vx = -Math.abs(node.vx); }
      if (node.y < PADDING) { node.vy = Math.abs(node.vy); }
      if (node.y > VIEWBOX_H - PADDING) { node.vy = -Math.abs(node.vy); }

      // Lit nodes swell a little
      const g = glowOf(node);
      node.el.setAttribute('cx', node.x);
      node.el.setAttribute('cy', node.y);
      node.el.setAttribute('r', node.r0 * (1 + (node.type === 'university' ? 0.3 : 0.2) * g));

      if (node.outerRingEl) {
        node.outerRingEl.setAttribute('cx', node.x);
        node.outerRingEl.setAttribute('cy', node.y);
        node.outerRingEl.setAttribute('r', UNI_RING.outerRadius * (1 + 0.1 * g));
        node.outerRingEl.setAttribute('stroke', g > 0.5 ? '#888888' : UNI_RING.outerStroke);
      }
      if (node.innerFillEl) {
        node.innerFillEl.setAttribute('cx', node.x);
        node.innerFillEl.setAttribute('cy', node.y);
        node.innerFillEl.setAttribute('r', UNI_RING.innerRadius * (1 + 0.1 * g));
      }
    });

    lineEls.forEach(({ el, base, from, to }) => {
      // Lines of the lit university darken
      el.setAttribute('opacity', base + (0.9 - base) * Math.max(glowOf(from), glowOf(to)));
      el.setAttribute('x1', from.x);
      el.setAttribute('y1', from.y);
      el.setAttribute('x2', to.x);
      el.setAttribute('y2', to.y);
    });

    const offset = (focus.type === 'university' ? UNI_RING.outerRadius * 1.1 : STYLE[focus.look || focus.type].radius) + 20;
    // Keep long names inside the box near the edges
    labelText.setAttribute('y', focus.y - offset);
    const half = labelText.getBBox().width / 2 + 8;
    labelText.setAttribute('x', Math.min(Math.max(focus.x, half), VIEWBOX_W - half));

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
})();
</script>
<!-- EMBED BİTİR -->
</div>
<script src="kritik.js" data-sayfa="network-script"></script>
